name: AudioEnergyAnalyzer Windows Build

on:
  push:
    branches: [ main, "work/**", "feature/**", "fix/**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      CI: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Run tests and build Windows EXE
        shell: cmd
        run: call build_windows.bat

      - name: Verify packaged output
        shell: pwsh
        run: |
          $exe = "dist/AudioEnergyAnalyzer.exe"
          if (!(Test-Path $exe)) {
            throw "Expected EXE was not generated: $exe"
          }
          if ((Get-Item $exe).Length -le 0) {
            throw "Generated EXE is empty."
          }
          if (!(Test-Path "dist/config/Reference_Average_Default.json")) {
            throw "Default reference JSON is missing from dist/config."
          }
          Get-Item $exe | Select-Object FullName, Length

      - name: Smoke-test packaged EXE startup
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/AudioEnergyAnalyzer.exe").Path
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 15
          $process.Refresh()
          if ($process.HasExited) {
            throw "AudioEnergyAnalyzer.exe exited during startup (exit code $($process.ExitCode))."
          }
          Stop-Process -Id $process.Id -Force

      - name: Package ZIP with stable top-level folder
        shell: pwsh
        run: |
          $stage = Join-Path $PWD "package/AudioEnergyAnalyzer"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "dist/AudioEnergyAnalyzer.exe" $stage
          if (Test-Path "dist/config") { Copy-Item "dist/config" $stage -Recurse }
          if (Test-Path "dist/ffmpeg") { Copy-Item "dist/ffmpeg" $stage -Recurse }
          $zip = "AudioEnergyAnalyzer-${{ github.run_number }}.zip"
          Compress-Archive -Path $stage -DestinationPath $zip -Force
          if (!(Test-Path $zip)) { throw "ZIP package was not generated: $zip" }
          $entries = tar -tf $zip
          if (!($entries | Where-Object { $_ -like "AudioEnergyAnalyzer/AudioEnergyAnalyzer.exe" })) {
            throw "ZIP does not contain AudioEnergyAnalyzer/AudioEnergyAnalyzer.exe at the expected path."
          }
      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AudioEnergyAnalyzer-${{ github.run_number }}
          path: AudioEnergyAnalyzer-${{ github.run_number }}.zip
          if-no-files-found: error
          retention-days: 7
